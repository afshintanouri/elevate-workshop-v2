<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071B2D" />
  <meta name="description" content="Design a deliberate learning journey across Enhance, Empower, Adopt and Shape." />
  <title>Elevate | AI Learning Journey Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <a class="skip-link" href="#app">Skip to designer</a>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Elevate home">
      <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
      <span><b>ELEVATE</b><small>AI Learning Journey Designer</small></span>
    </a>
    <div class="header-actions">
      <span class="privacy"><span class="privacy-dot"></span> Private by design</span>
      <button class="ghost-button" id="clearData">Reset</button>
    </div>
  </header>

  <div class="shell">
    <aside class="rail" aria-label="Journey progress">
      <div class="rail-kicker">YOUR JOURNEY</div>
      <nav id="progress"></nav>
      <div class="rail-quote">“Design where the thinking happens.”</div>
    </aside>
    <main id="app" tabindex="-1"></main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
